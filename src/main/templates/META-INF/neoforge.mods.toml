modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = "https://github.com/LoveTropics/LTDonations/issues"
license = "Mozilla Public License Version 2.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "LTDonations"
displayURL = "https://lovetropics.org"
authors = "The Love Tropics Team"
description = '''
Donation event manager for the LoveTropics livestream.
'''

[[mixins]]
config = "ltdonations.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
